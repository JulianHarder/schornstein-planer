<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Alles lokal: keine externen Ressourcen, keine Verbindungen nach außen. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'">
  <title>Schornstein-Planer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21V9h4v12M9 9V4h2v5M14 21v-8h4v8M3 21h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Schornstein-<wbr>Planer</span>
      </div>

      <nav class="nav" aria-label="Hauptnavigation">
        <a href="#/projekte" data-route="projekte">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Projekte
        </a>
        <a href="#/kanban" data-route="kanban">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="4" width="5" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="4" width="4" height="13" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          Kanban
        </a>
        <a href="#/kalender" data-route="kalender">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Kalender
        </a>
        <a href="#/archiv" data-route="archiv">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Archiv
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost" data-action="export">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Daten exportieren
        </button>
        <button type="button" class="btn btn-ghost" data-action="import">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Daten importieren
        </button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <p class="privacy-note">Alle Daten bleiben lokal in diesem Browser. Es werden keine Daten übertragen.</p>
      </div>
    </aside>

    <div class="content">
      <div class="topbar">
        <button type="button" class="icon-btn" data-action="toggle-theme" id="themeBtn" aria-label="Zum Dunkelmodus wechseln" title="Zum Dunkelmodus wechseln">
          <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        </button>
      </div>
      <main class="main" id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="projectDialog" aria-labelledby="dialogTitle"></dialog>

  <script src="js/app.js"></script>
</body>
</html>
